      treatment_failure_refractory: ["refractory", "treatment failure", "anti-tnf exposed", "post infliximab", "second-line", "second line"]
      pre_diagnosis: ["undifferentiated", "workup", "diagnostic workup", "pre-diagnosis", "pre diagnosis"]

  - id: population
    label: "Patient population"
    order: 6
    role: "Patient population characteristics. Orthogonal to setting."
    activation: optional
    allows_all: true
    allows_na: true
    values:
      - {id: adults, status: canonical, provenance: "default"}
      - {id: pediatrics, status: canonical, provenance: "POP_PED; TOP0084"}
      - {id: older_adults, status: canonical, provenance: "POP_OLDER"}
