      - {id: ambulatory_surgical, status: canonical, provenance: "BR_SURG"}
      - {id: primary_care_community, status: canonical, provenance: "expert"}
      - {id: global_resource_variable, status: canonical, provenance: "POP_GLOBAL; BR_EQ"}

  - id: anatomy
    label: "Anatomy (organ)"
    order: 8
    role: "METADATA or SECONDARY axis ONLY — never the spine. Usually derivable from disease."
    activation: optional
    allows_all: true
    allows_na: true
    values:
      - {id: esophagus, status: canonical, provenance: "BR_ESO"}
      - {id: egj, status: canonical, provenance: "TOP0009"}
      - {id: stomach, status: canonical, provenance: "BR_STO"}
      - {id: duodenum, status: canonical, provenance: "BR_STO"}
