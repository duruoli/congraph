      - {id: serology, status: canonical, provenance: "TOP0015"}
      - {id: ai_image_classification, status: canonical, provenance: "MOD_AI; TOP0001"}
      - {id: nlp_ehr_mining, status: canonical, provenance: "TOP0001"}
      - {id: omics_molecular_diagnostics, status: canonical, provenance: "MOD_OMICS; TOP0078"}  # RESEARCH-ONLY: not for clinically deployed molecular diagnostics.
      - {id: noninvasive_fibrosis_markers, status: canonical, provenance: "TOP0071/TOP0018"}
      - {id: breath_test, status: canonical, provenance: "TOP0057"}
    synonyms:
