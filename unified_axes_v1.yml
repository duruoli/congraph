      upper_endoscopy: ["upper endoscopy", "egd", "esophagogastroduodenoscopy", "endoscopy"]
      cross_sectional_imaging_ct: ["ct", "computed tomography", "ct enterography", "cte", "ct scan", "ct angiography"]
      cross_sectional_imaging_mri: ["mri", "magnetic resonance imaging", "mri enterography", "mre", "mr enterography"]
      cross_sectional_imaging_mrcp: ["mrcp", "magnetic resonance cholangiopancreatography"]

  - id: clinical_phase
    label: "Clinical phase / trajectory"
    order: 5
    role: "WHERE in the disease course / decision sequence the topic sits."
    activation: optional
    allows_all: false
    allows_na: true
    values:
      # Design notes (attestation 2026-07-08):
      # - `pre_diagnosis` (trajectory position; undifferentiated workup) is orthogonal
      #   to management_domain: `diagnosis_workup` (the decision AT HAND is diagnostic).
      # - `monitoring_remission` (patient IS in remission being monitored) is orthogonal
      #   to management_domain: `monitoring` (the decision AT HAND is monitoring).
      # - `surveillance_post_treatment` (post-cancer surveillance trajectory) is
      #   orthogonal to management_domain: `surveillance` (the decision AT HAND is
