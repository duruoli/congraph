      jak_inhibitor: ["jak inhibitor", "jaki", "janus kinase inhibitor", "tofacitinib", "upadacitinib", "filgotinib"]
      s1p_modulator: ["s1p modulator", "s1p receptor modulator", "sphingosine 1-phosphate modulator", "ozanimod", "etrasimod"]
      corticosteroid: ["steroid", "steroids", "corticosteroid", "prednisone", "budesonide"]
      surgical: ["surgery", "surgical", "colectomy", "proctocolectomy", "ipaa", "ileal pouch"]
      aminosalicylate: ["5-asa", "5 asa", "mesalamine", "sulfasalazine", "aminosalicylate"]
      endoscopic_therapeutic: ["endoscopic therapy", "therapeutic endoscopy", "hemostasis", "variceal ligation", "band ligation", "epinephrine injection", "clipping", "hemoclip", "argon plasma coagulation", "apc", "cautery"]
      dgbi_pharmacotherapy: ["gut-targeted pharmacotherapy", "linaclotide", "plecanatide", "lubiprostone", "eluxadoline", "rifaximin"]
      motility_pharmacotherapy: ["prokinetic", "prokinetics", "metoclopramide", "prucalopride", "domperidone"]

  - id: diagnostic_modality
    label: "Diagnostic / characterization modality"
    order: 4
    role: "How the disease is detected or characterized."
    activation: conditionally_required
    allows_all: false
    allows_na: true
    values:
      - {id: colonoscopy, status: canonical, provenance: "MOD_COLONOSCOPY + TOP0013 (absorbs flexible_sigmoidoscopy 2026-07-08)"}  # Includes flexible sigmoidoscopy.
      - {id: upper_endoscopy, status: canonical, provenance: "MOD_ENDOSCOPY"}
      - {id: eus, status: canonical, provenance: "MOD_EUS; TOP0029"}
      - {id: ercp_diagnostic, status: canonical, provenance: "MOD_ERCP; TOP0028"}
